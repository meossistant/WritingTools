name: Build Executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows-x64
            artifact_name: Writing-Tools-Windows-x64
          - os: ubuntu-latest
            platform_name: Linux-x64
            artifact_name: Writing-Tools-Linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libdbus-1-3

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sync build dependencies
        run: uv sync --locked --group build

      - name: Build with PyInstaller
        run: uv run --group build python scripts/build_pyinstaller.py

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          Compress-Archive -Path "dist\Writing Tools.exe", "README.md", "CHANGELOG.md", "LICENSE" `
            -DestinationPath "release_assets\${{ matrix.artifact_name }}.zip"

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p release_assets
          chmod +x "dist/Writing Tools"
          tar -czf "release_assets/${{ matrix.artifact_name }}.tar.gz" \
            -C dist "Writing Tools" \
            -C .. README.md CHANGELOG.md LICENSE

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
