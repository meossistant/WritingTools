name: Build Executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows-x64
            artifact_name: Writing-Tools-Windows-x64
          - os: ubuntu-latest
            platform_name: Linux-x64
            artifact_name: Writing-Tools-Linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install build system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libdbus-1-3 \
            xvfb

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Sync build dependencies
        run: uv sync --locked --group build

      - name: Build with PyInstaller
        run: uv run --group build python scripts/build_pyinstaller.py

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\Writing Tools.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "Windows executable smoke test failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

      - name: Smoke-test Linux executable
        if: runner.os == 'Linux'
        run: |
          chmod +x "dist/Writing Tools"
          xvfb-run -a "./dist/Writing Tools" --smoke-test

      - name: Stage Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item -Path "dist\Writing Tools.exe", "README.md", "CHANGELOG.md", "LICENSE" -Destination staging\

      - name: Stage Linux release files
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging
          cp "dist/Writing Tools" README.md CHANGELOG.md LICENSE staging/
          chmod +x "staging/Writing Tools"

      - name: Upload build artifact (unpacked to avoid nested zip)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Package release archives
        run: |
          mkdir -p release_files
          (cd artifacts/Writing-Tools-Windows-x64 && zip -r ../../release_files/Writing-Tools-Windows-x64.zip .)
          chmod +x "artifacts/Writing-Tools-Linux-x64/Writing Tools"
          tar -czf release_files/Writing-Tools-Linux-x64.tar.gz -C artifacts/Writing-Tools-Linux-x64 .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: release_files/*
          generate_release_notes: true
