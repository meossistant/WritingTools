    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "darkdetect", specifier = ">=0.8.0" },
    { name = "markdown2", specifier = ">=2.5.5" },
    { name = "pydantic-ai-slim", extras = ["google", "openai"], specifier = ">=2.71.0" },
    { name = "pynput", specifier = ">=1.8.2" },
    { name = "pyperclip", specifier = ">=1.11.0" },
    { name = "pyside6", specifier = ">=6.12.0" },
]

[package.metadata.requires-dev]
build = [{ name = "pyinstaller", specifier = ">=6.22.3" }]
dev = [{ name = "pytest", specifier = ">=9.0.0" }]
